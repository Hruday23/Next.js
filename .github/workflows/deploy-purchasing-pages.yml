name: Deploy purchasing app to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "purchasing/**"
      - "reusable-components/**"
      - ".github/workflows/deploy-purchasing-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: purchasing/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate backend URL
        env:
          SAREE_API_URL: ${{ secrets.SAREE_API_URL }}
        run: |
          if [ -z "$SAREE_API_URL" ]; then
            echo "::error::Set the SAREE_API_URL repository Actions secret to your deployed backend URL."
            exit 1
          fi

      - name: Install dependencies
        working-directory: purchasing
        run: npm ci

      - name: Build static site
        working-directory: purchasing
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /Next.js
          SAREE_API_URL: ${{ secrets.SAREE_API_URL }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: purchasing/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
